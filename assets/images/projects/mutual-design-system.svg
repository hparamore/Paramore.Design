<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Mutual Design System — live token explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F4F6"/>
    </linearGradient>
    <style>
      .mono{font-family:'Space Grotesk',ui-monospace,monospace;}
      .sans{font-family:'Space Grotesk',-apple-system,Segoe UI,Roboto,sans-serif;}
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#E4E4E8"/>

  <!-- eyebrow -->
  <text x="64" y="92" class="mono" font-size="17" letter-spacing="3" fill="#000080">DESIGN SYSTEM // ENGINEERS &amp; AI AGENTS BUILD FROM IT</text>

  <!-- title -->
  <text x="62" y="178" class="sans" font-size="74" font-weight="700" fill="#1A1A1E">Mutual Design System</text>
  <text x="64" y="226" class="sans" font-size="25" font-weight="400" fill="#454545">One token layer · 3 brands · 6 themes · live WCAG contrast</text>

  <!-- brand color strip -->
  <g>
    <rect x="64"  y="286" width="100" height="100" rx="16" fill="#000080"/>
    <rect x="176" y="286" width="100" height="100" rx="16" fill="#E9E4EE"/>
    <rect x="288" y="286" width="100" height="100" rx="16" fill="#FEB95F"/>
    <rect x="400" y="286" width="100" height="100" rx="16" fill="#FF806D"/>
    <rect x="512" y="286" width="100" height="100" rx="16" fill="#F60063"/>
    <rect x="624" y="286" width="100" height="100" rx="16" fill="#3845E7"/>
  </g>

  <!-- sample components -->
  <g>
    <rect x="768" y="286" width="180" height="48" rx="16" fill="#F60063"/>
    <text x="858" y="316" text-anchor="middle" class="sans" font-size="17" font-weight="500" fill="#FFFFFF">Primary CTA</text>

    <rect x="768" y="346" width="180" height="40" rx="16" fill="#E9E4EE"/>
    <text x="858" y="371" text-anchor="middle" class="sans" font-size="15" font-weight="500" fill="#272525">Secondary</text>

    <rect x="960" y="286" width="92" height="30" rx="12" fill="#FEB95F"/>
    <text x="1006" y="306" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#000000">Premium</text>
    <rect x="1064" y="286" width="72" height="30" rx="12" fill="#000000"/>
    <text x="1100" y="306" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#FFFFFF">Dark</text>
    <rect x="960" y="326" width="176" height="30" rx="12" fill="none" stroke="#BAB7B7" stroke-width="2"/>
    <text x="1048" y="346" text-anchor="middle" class="sans" font-size="14" font-weight="500" fill="#272525">Outline chip</text>
  </g>

  <!-- footer token line -->
  <text x="64" y="470" class="mono" font-size="16" fill="#757575">{ </text>
  <text x="84" y="470" class="mono" font-size="16" fill="#000080">"button.primary"</text>
  <text x="248" y="470" class="mono" font-size="16" fill="#757575">: { </text>
  <text x="286" y="470" class="mono" font-size="16" fill="#000080">"bg"</text>
  <text x="320" y="470" class="mono" font-size="16" fill="#757575">: </text>
  <text x="334" y="470" class="mono" font-size="16" fill="#1B7F3B">"#F60063"</text>
  <text x="424" y="470" class="mono" font-size="16" fill="#757575">, </text>
  <text x="438" y="470" class="mono" font-size="16" fill="#000080">"contrast"</text>
  <text x="528" y="470" class="mono" font-size="16" fill="#757575">: </text>
  <text x="542" y="470" class="mono" font-size="16" fill="#B07A18">4.12</text>
  <text x="586" y="470" class="mono" font-size="16" fill="#757575"> } }</text>

  <!-- brand tags -->
  <text x="64" y="540" class="mono" font-size="15" letter-spacing="2" fill="#959699">MUTUAL&#160;&#160;·&#160;&#160;ARK&#160;&#160;·&#160;&#160;TONITE&#160;&#160;&#160;&#8212;&#160;&#160;&#160;SWIFT&#160;+&#160;REACT&#160;FROM&#160;ONE&#160;SOURCE</text>
</svg>
